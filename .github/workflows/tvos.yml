name: Build tvOS IPA
on:
  push:
    branches: [main]
    paths: ['tv/**', 'index.html', 'img/**', 'VERSION', '.github/workflows/tvos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ldid
        run: brew install ldid || true
      - name: Build IPA
        shell: bash
        run: |
          set -o pipefail
          bash tv/build.sh 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: HangulByeolbam-ipa
          path: build/*.ipa
      - name: Publish build log to buildlog branch
        if: always()
        run: |
          mkdir /tmp/bl && cp build.log /tmp/bl/ 2>/dev/null || echo "no log" > /tmp/bl/build.log
          cd /tmp/bl && git init -q && git checkout -q -b buildlog
          git config user.name gh-actions && git config user.email actions@github.com
          git add -A && git commit -qm "build log" 
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" buildlog
