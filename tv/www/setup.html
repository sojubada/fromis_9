<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>한글 별밤 · 사진과 설정</title>
<style>
body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#121735;color:#fff;margin:0;padding:18px;max-width:720px;margin:0 auto;line-height:1.5}
h1{font-size:22px}h2{font-size:17px;margin:26px 0 8px;color:#ffc83a}
.box{background:#1e2858;border-radius:14px;padding:14px}
input[type=text],input[type=password]{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:0;font-size:16px;margin:6px 0}
button{background:#ffc83a;color:#1a1e3c;border:0;border-radius:10px;padding:10px 16px;font-size:16px;font-weight:700;margin:4px 6px 4px 0}
button.s{background:#ffffff22;color:#fff}
.help{color:#a9b2dc;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.ph{background:#121735;border-radius:10px;padding:6px;font-size:13px}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
#msg{margin-top:10px;color:#9be3a8;min-height:1.4em}
</style></head><body>
<h1>📺 한글 별밤 설정</h1>
<p class="help">Apple TV와 같은 와이파이에서 열어 주세요. 사진은 TV 안에만 저장되고 인터넷으로 나가지 않습니다.</p>

<h2>1. 가족 사진 넣기 (게임 중 깜짝 이벤트)</h2>
<div class="box">
  <label class="help">사진 제목 (비우면 "우리 가족 사진"). 사진 속 이야기를 짧게 적어 주세요.</label>
  <input type="text" id="cap" maxlength="20" placeholder="예: 놀이공원 가던 날">
  <input type="file" id="files" accept="image/*" multiple>
  <div><button id="up">올리기</button></div>
  <div id="msg"></div>
</div>

<h2>2. 올려 둔 사진</h2>
<div class="box"><div class="grid" id="list"></div><p class="help" id="none" hidden>아직 사진이 없어요.</p></div>

<h2>3. 아이 이름</h2>
<div class="box"><input type="text" id="nm" maxlength="8" placeholder="예: 하준"><div><button id="ns">저장</button></div><div id="nmsg" class="help"></div></div>

<h2>4. 클로드 API 키</h2>
<div class="box">
  <p class="help">키는 이 Apple TV 안에만 저장되고, 클로드 서버로만 보내집니다. 입력하면 클로드가 문제를 고르고 학습 보고서를 씁니다.</p>
  <input type="password" id="key" placeholder="sk-ant-로 시작하는 키" autocomplete="off">
  <div><button id="ks">저장</button><button class="s" id="kd">지우기</button></div>
  <div id="kmsg" class="help"></div>
</div>

<p class="help" id="diag"></p>
<script>
function $(i){return document.getElementById(i);}
function say(t,ok){var m=$("msg");m.textContent=t;m.style.color=ok===false?"#ff9a8a":"#9be3a8";}
function refresh(){
  fetch("/api/photos").then(function(r){return r.json();}).then(function(l){
    var g=$("list");g.textContent="";$("none").hidden=l.length>0;
    l.forEach(function(p){
      var d=document.createElement("div");d.className="ph";
      var im=document.createElement("img");im.src="/photos/"+encodeURIComponent(p.f);im.loading="lazy";
      var c=document.createElement("div");c.textContent=p.c;
      var b=document.createElement("button");b.className="s";b.textContent="삭제";
      b.onclick=function(){if(confirm("이 사진을 지울까요?"))fetch("/api/delete?f="+encodeURIComponent(p.f),{method:"POST"}).then(refresh);};
      d.appendChild(im);d.appendChild(c);d.appendChild(b);g.appendChild(d);});
  });
  fetch("/api/info").then(function(r){return r.json();}).then(function(i){if(i.name&&!$("nm").value)$("nm").value=i.name;$("kmsg").textContent=i.hasKey?"키가 저장되어 있어요.":"키가 아직 없어요.";});
}
function shrink(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var m=1280,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res(b):rej();},"image/jpeg",0.86);};
    im.onerror=function(){URL.revokeObjectURL(url);rej();};im.src=url;});
}
$("up").onclick=function(){
  var fs=[].slice.call($("files").files);if(!fs.length){say("사진을 먼저 골라 주세요.",false);return;}
  var cap=$("cap").value,n=0,fail=0,why="";$("up").disabled=true;
  fs.reduce(function(p,f,i){return p.then(function(){say((i+1)+"/"+fs.length+" 올리는 중…");
    return shrink(f).then(function(b){return fetch("/upload?cap="+encodeURIComponent(cap),{method:"POST",headers:{"Content-Type":"image/jpeg"},body:b});})
      .then(function(r){if(r.ok)n++;else{fail++;return r.text().then(function(x){why=x;});}}).catch(function(e){fail++;why=String(e&&e.message||e);});});},Promise.resolve())
  .then(function(){$("up").disabled=false;$("files").value="";say(n+"장 올렸어요."+(fail?" ("+fail+"장 실패: "+why+")":""),!fail);refresh();diag();});
};
$("ks").onclick=function(){var k=$("key").value.trim();
  if(!/^sk-ant-[A-Za-z0-9_\-]{20,}$/.test(k)){$("kmsg").textContent="키 모양이 맞지 않아요.";return;}
  post("/api/config",JSON.stringify({key:k}),$("kmsg"),"저장했어요. TV에서 앱을 껐다 다시 켜면 적용돼요.").then(function(){$("key").value="";});};
function post(url,body,out,okText){
  out.style.color="#a9b2dc";out.textContent="보내는 중…";
  return fetch(url,{method:"POST",body:body}).then(function(r){return r.text().then(function(tx){
    if(!r.ok)throw new Error(tx||("오류 "+r.status));out.style.color="#9be3a8";out.textContent=okText;diag();});})
  .catch(function(e){out.style.color="#ff9a8a";out.textContent="실패: "+(e&&e.message?e.message:e)+" (TV 앱이 켜져 있는지 확인해 주세요)";});
}
$("ns").onclick=function(){post("/api/config",JSON.stringify({name:$("nm").value.trim()}),$("nmsg"),"저장했어요. TV에서 앱을 껐다 다시 켜면 적용돼요.");};
$("kd").onclick=function(){post("/api/config",JSON.stringify({key:""}),$("kmsg"),"키를 지웠어요.");};
function diag(){fetch("/api/diag").then(function(r){return r.json();}).then(function(d){
  $("diag").textContent="서버 상태 · 저장 위치: "+d.base+" · 사진 "+d.photos+"장 · 이름 "+(d.name||"없음")+" · 키 "+(d.hasKey?"있음":"없음")+(d.problems?" · 문제: "+d.problems:"")+(d.lastError?" · 마지막 오류: "+d.lastError:"");}).catch(function(){$("diag").textContent="TV 앱과 연결되지 않았어요.";});}
refresh();diag();
</script></body></html>
